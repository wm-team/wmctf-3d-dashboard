<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wind Flag Demo</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="scene" aria-label="wind animated flag model"></canvas>

      <section class="toolbar" aria-label="wind controls">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Wind Flag</span>
        </div>

        <label>
          <span>强度</span>
          <input id="strength" type="range" min="0" max="1.8" value="1" step="0.01" />
          <output id="strengthValue">1.00</output>
        </label>

        <label>
          <span>风速</span>
          <input id="speed" type="range" min="0.2" max="2.8" value="1.15" step="0.01" />
          <output id="speedValue">1.15</output>
        </label>

        <label>
          <span>阵风</span>
          <input id="gust" type="range" min="0" max="1.2" value="0.45" step="0.01" />
          <output id="gustValue">0.45</output>
        </label>

        <button id="toggle" type="button" aria-pressed="false" title="暂停/播放">⏸</button>
        <button id="reset" type="button" title="重置视角">⟲</button>
      </section>

      <div id="loading" class="loading" role="status">Loading model</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
